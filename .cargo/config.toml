# Frame pointers needed for samply/Instruments to get accurate/deep call stacks on macOS.
[build]
rustflags = ["-C", "force-frame-pointers=yes"]

[target.aarch64-unknown-linux-gnu]
rustflags = ["-C", "force-frame-pointers=yes", "-C", "target-feature=+aes"]

# `pclmulqdq` selects the carryless-multiply GF(2^128) kernel; without it the
# portable 64-step loop runs instead.
[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "force-frame-pointers=yes", "-C", "target-feature=+pclmulqdq,+sse4.1"]

[target.x86_64-apple-darwin]
rustflags = ["-C", "force-frame-pointers=yes", "-C", "target-feature=+pclmulqdq,+sse4.1"]
